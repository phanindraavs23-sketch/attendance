<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Attendance</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0}.wrap{max-width:600px;margin:30px auto;padding:16px}
.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 18px #0001}
select,input,button{width:100%;padding:14px;margin-top:10px;font-size:18px;border-radius:9px;box-sizing:border-box}
input[readonly]{background:#f1f3f5;color:#555}.attendance-form{display:none}.notice{padding:18px;margin-top:18px;border-radius:10px;background:#f8f9fa;border:1px solid #ddd}.notice h2{margin:0 0 8px;font-size:22px}.notice p{margin:6px 0;line-height:1.5}
button{background:#111;color:#fff;border:0;cursor:pointer}.ok{padding:14px;background:#e8f7ed;margin-top:15px;border-radius:9px}.error{color:#b42318}.muted{color:#666}.label{display:block;margin-top:12px;font-weight:bold;font-size:14px}
</style></head>
<body><div class="wrap"><div class="card"><h1>Employee Attendance</h1>
<p class="muted">Scan the company QR code, select your name, verify your Employee ID, enter your location, then choose Login or Logout.</p>
<div id="notice" class="notice" style="display:none"></div>
<div id="attendanceForm" class="attendance-form">
<label class="label" for="person">Employee Name</label>
<select id="person" onchange="updateEmployeeId()"></select>
<label class="label" for="employeeId">Employee ID</label>
<input id="employeeId" type="text" readonly placeholder="Employee ID will appear here">
<label class="label" for="location">Location</label>
<input id="location" placeholder="Enter location (e.g. Office / Home)" autocomplete="off">
<button onclick="mark('LOGIN')">Login</button>
<button onclick="mark('LOGOUT')">Logout</button>
</div><div id="msg"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
const token=new URLSearchParams(location.search).get('session');
let people=[];
async function boot(){
 if(!token)return showNoSession();
 const {data:s,error}=await sb.from('attendance_sessions').select('token,expires_at').eq('token',token).single();
 if(error||!s||new Date(s.expires_at)<=new Date())return fail('This QR session is expired or invalid. Please scan a new company QR code.');
 const {data:p,error:e}=await sb.from('people').select('id,name').eq('active',true).order('id');
 if(e)return fail(e.message);
 people=p||[];
 person.innerHTML='<option value="">Select employee name</option>'+people.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
 attendanceForm.style.display='block'; notice.style.display='none';
}
function updateEmployeeId(){employeeId.value=person.value||'';}
function showNoSession(){
 notice.style.display='block';
 notice.innerHTML='<h2>Please scan the company QR code</h2><p>This page can only be used after scanning a valid attendance QR code.</p><p>Ask your HR or Manager to display the current attendance QR code, then scan it with your phone.</p>';
 attendanceForm.style.display='none'; msg.innerHTML='';
}
async function mark(action){
 if(!person.value)return alert('Select your employee name.');
 if(!location.value.trim())return alert('Enter your location.');
 const id=Number(person.value);
 const name=people.find(p=>p.id===id)?.name||'';
 const {error}=await sb.from('attendance').insert({session_token:token,person_id:id,action,location:location.value.trim()});
 if(error)return fail(error.message);
 msg.innerHTML='<div class="ok"><b>'+esc(name)+'</b><br>Employee ID: <b>'+id+'</b><br>Location: <b>'+esc(location.value.trim())+'</b><br>Attendance <b>'+action+'</b> recorded successfully at '+new Date().toLocaleTimeString()+'.</div>';
}
function fail(x){msg.innerHTML='<p class="error">'+esc(x)+'</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
boot();
</script></body></html>
