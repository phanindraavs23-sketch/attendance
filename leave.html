<html lang="en">
<head>

<style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#dbeafe,transparent 32%),radial-gradient(circle at 100% 0%,#ede9fe,transparent 30%),var(--bg);color:var(--ink)}.wrap{max-width:720px;margin:0 auto;padding:30px 18px 50px}.back{display:inline-flex;text-decoration:none;color:#475569;font-size:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #fff;border-radius:26px;box-shadow:0 24px 70px #1e293b14;overflow:hidden}.head{padding:32px;background:linear-gradient(135deg,#eff6ff,#f5f3ff)}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:20px}.head h1{margin:0 0 8px;font-size:30px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted);line-height:1.6}.form{padding:30px}.label{display:block;margin:17px 0 7px;font-size:13px;font-weight:800;color:#334155}.field,textarea,button{width:100%;font:inherit}.field,textarea{padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;outline:none;background:#fff}.field:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 4px #3b82f61a}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.submit{margin-top:23px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 25px #2563eb30}.submit:disabled{opacity:.55}.ok,.error{padding:14px;border-radius:13px;margin-top:16px}.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.small{font-size:12px;color:#64748b}@media(max-width:600px){.row2{grid-template-columns:1fr}.head,.form{padding:23px}}
</style>
<style>
/* ===== 118 Attendance Portal — unified premium UI ===== */
:root{
  --p-bg:#f4f7fb;
  --p-surface:rgba(255,255,255,.92);
  --p-ink:#122033;
  --p-muted:#64748b;
  --p-line:#e2e8f0;
  --p-brand:#2563eb;
  --p-brand2:#7c3aed;
  --p-success:#059669;
  --p-danger:#dc2626;
  --p-shadow:0 18px 55px rgba(15,23,42,.09);
}
html{scroll-behavior:smooth}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif !important;
  background:
    radial-gradient(circle at 8% -5%,rgba(59,130,246,.18),transparent 28%),
    radial-gradient(circle at 96% 2%,rgba(124,58,237,.14),transparent 27%),
    linear-gradient(180deg,#f8fbff 0%,var(--p-bg) 100%) !important;
  color:var(--p-ink) !important;
}
.portal-nav{
  position:sticky;top:0;z-index:1000;
  width:100%;
  display:flex;align-items:center;gap:12px;
  padding:12px max(18px,calc((100% - 1240px)/2));
  background:rgba(255,255,255,.82);
  border-bottom:1px solid rgba(226,232,240,.9);
  backdrop-filter:blur(18px);
  box-shadow:0 8px 30px rgba(15,23,42,.05);
}
.portal-brand{
  display:flex;align-items:center;gap:10px;
  color:var(--p-ink);text-decoration:none;font-weight:850;
  margin-right:10px;white-space:nowrap;
}
.portal-logo{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:white;font-size:12px;font-weight:900;
  background:linear-gradient(135deg,var(--p-brand),var(--p-brand2));
  box-shadow:0 8px 20px rgba(37,99,235,.25);
}
.portal-links{
  display:flex;align-items:center;gap:4px;overflow-x:auto;
  scrollbar-width:none;flex:1;
}
.portal-links::-webkit-scrollbar{display:none}
.portal-links a{
  color:#475569;text-decoration:none;font-size:13px;font-weight:700;
  padding:9px 11px;border-radius:10px;white-space:nowrap;
  transition:.18s ease;
}
.portal-links a:hover{background:#eff6ff;color:var(--p-brand)}
.portal-links a.active{background:#eef2ff;color:#4f46e5}
.portal-secure{
  font-size:11px;font-weight:800;color:#047857;
  background:#ecfdf5;border:1px solid #bbf7d0;
  border-radius:999px;padding:7px 10px;white-space:nowrap;
}
body > .wrap, body > .container{position:relative}
.card{
  border-color:rgba(226,232,240,.9) !important;
  box-shadow:var(--p-shadow) !important;
}
input,select,textarea,.field{
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
input:focus,select:focus,textarea:focus,.field:focus{
  border-color:#60a5fa !important;
  box-shadow:0 0 0 4px rgba(59,130,246,.10) !important;
  outline:none;
}
button{
  transition:transform .18s,box-shadow .18s,opacity .18s !important;
}
button:not(:disabled):hover{
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(15,23,42,.14);
}
table{border-collapse:separate !important;border-spacing:0 !important;overflow:hidden;border:1px solid var(--p-line);border-radius:14px}
th{
  background:linear-gradient(180deg,#f8fafc,#f1f5f9) !important;
  color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
}
th,td{border-bottom:1px solid var(--p-line) !important}
tr:last-child td{border-bottom:0 !important}
.badge{font-weight:800}
@media(max-width:760px){
  .portal-nav{padding:10px 12px;gap:8px}
  .portal-brand span:last-child{display:none}
  .portal-secure{display:none}
}

/* Leave forms */
.wrap{padding-top:34px !important}
.card{border-radius:28px !important}
.head{
  background:
    radial-gradient(circle at 100% 0%,rgba(124,58,237,.12),transparent 35%),
    linear-gradient(135deg,#eff6ff,#f5f3ff) !important;
}
.head h1{letter-spacing:-.04em !important}
.logo{box-shadow:0 10px 25px rgba(37,99,235,.22)}
.btn,.form button{
  background:linear-gradient(135deg,var(--p-brand),#4f46e5) !important;
  font-weight:800 !important;border:0 !important;
}
.ok{border:1px solid #bbf7d0 !important}
</style>
</head>
<body>

<nav class="portal-nav" aria-label="Main portal navigation">
  <a class="portal-brand" href="portal.html" aria-label="118 Attendance home">
    <span class="portal-logo">118</span><span>118 Attendance</span>
  </a>
  <div class="portal-links">
    <a href="portal.html">Portal</a>
    <a href="attendance.html">Attendance</a>
    <a href="leave.html">Apply Leave</a>
    <a href="leave-status.html">Leave Status</a>
    <a href="manager.html">Manager</a>
    <a href="hr.html">HR</a>
  </div>
  <span class="portal-secure">● Secure Portal</span>
</nav>
<script>
(function(){
  const page=(location.pathname.split('/').pop()||'portal.html').toLowerCase();
  document.querySelectorAll('.portal-links a').forEach(a=>{
    const target=a.getAttribute('href').toLowerCase();
    if(target===page || (page==='index.html' && target==='portal.html')) a.classList.add('active');
  });
})();
</script>
<div class="wrap">
<a class="back" href="portal.html">← Back to portal</a>
<div class="card">
<div class="head"><div class="logo">118</div><h1>Apply for Leave</h1><p>Submit your leave request using your Employee ID. No employee email is required.</p></div>
<div class="form">
<label class="label" for="employeeName">Employee Name</label><input class="field" id="employeeName" placeholder="Enter your full name" autocomplete="name">
<label class="label" for="employeeId">Employee ID</label><input class="field" id="employeeId" placeholder="Enter Employee ID">
<label class="label" for="employeeLocation">Location</label><input class="field" id="employeeLocation" placeholder="Office / Home / Site">
<label class="label">Leave dates</label><div class="row2"><input class="field" id="startDate" type="date"><input class="field" id="endDate" type="date"></div>
<label class="label" for="reason">Reason</label><textarea id="reason" rows="4" placeholder="Reason for leave"></textarea>
<button class="submit" id="submitBtn" onclick="submitLeave()">Submit Leave Request</button><div id="msg"></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY),msg=document.getElementById('msg');
const params=new URLSearchParams(location.search);
const qrName=params.get('name')||'',qrEmployeeId=params.get('employeeId')||params.get('employee_id')||'',qrLocation=params.get('location')||'';
if(qrName) employeeName.value=qrName;if(qrEmployeeId) employeeId.value=qrEmployeeId;if(qrLocation) employeeLocation.value=qrLocation;
async function submitLeave(){
 const employee_name=employeeName.value.trim(),employee_id=employeeId.value.trim(),location=employeeLocation.value.trim(),start_date=startDate.value,end_date=endDate.value,reason=document.getElementById('reason').value.trim();
 if(!employee_name)return fail('Please enter your employee name.');if(!employee_id)return fail('Please enter your Employee ID.');
 if(!start_date||!end_date)return fail('Please select a start and end date.');if(end_date<start_date)return fail('End date cannot be before start date.');if(!reason)return fail('Please enter a reason.');
 setBusy(true);msg.innerHTML='';
 const {error}=await sb.from('leave_requests').insert({employee_id,employee_name,location:location||null,start_date,end_date,reason});
 setBusy(false);if(error)return fail(error.message);
 msg.innerHTML='<div class="ok"><b>Leave request submitted successfully.</b><br>'+esc(employee_name)+' ('+esc(employee_id)+')<br>'+esc(start_date)+' to '+esc(end_date)+'<br><span class="small">Use the Leave Status portal with your Employee ID to check the decision.</span></div>';
}
function setBusy(v){document.getElementById('submitBtn').disabled=v}function fail(x){msg.innerHTML='<div class="error">'+esc(x)+'</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
